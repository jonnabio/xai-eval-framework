project:
  type: book
  output-dir: _output
  post-render:
    - post_render_format.py

book:
  title: "Marco para la Evaluación Multinivel de la Explicabilidad en IA"
  subtitle: "Integración de Benchmarking Técnico, Protocolo Reproducible (FOM-7) y Taxonomía de Métricas"
  output-file: "JHerrera_XAI_Tesis_Doctorado"
  author: "J. Herrera"
  date: "2026-04-19"
  chapters:
    - index.qmd
    - introduccion.qmd
    - part: "Cuerpo de la Tesis"
      chapters:
        - capitulo-1-marco-teorico.qmd
        - capitulo-2-fundamentos.qmd
        - capitulo-3-diseno-experimental.qmd
        - capitulo-4-resultados.qmd
        - capitulo-5-taxonomia.qmd
        - capitulo-6-conclusiones.qmd
    - referencias.qmd
    - apendices.qmd

format:
  docx:
    reference-doc: assets/Plantilla_Tesis_Doctorado.docx
    toc: true
    number-sections: true
bibliography: references.bib
citeproc: true
