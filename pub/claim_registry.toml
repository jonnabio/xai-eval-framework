  # registered or structural; the remaining 6 are differences and complements
  # of registered values and need a composing resolver. See the 2026-09-02
  # sweep note in docs/review/top-level-statement-sweep.md.
  "thesis/capitulo-6-conclusiones.qmd",
]
# Design constants and decision thresholds, not measured results: Holm-adjusted
# alpha levels, Cohen's d_z interpretation cut-points, the selection-criterion
# thresholds and a stated tolerance. Fixed by the protocol, not derived from an
# artifact, so a resolver would be meaningless.
structural = [
  "0.05", "0.01", "0.0125", "0.0167", "0.025",
  "0.2", "0.5", "0.8", "2.0",
  "0.70", "0.80", "0.40",
  "0.002",
  # Tabulated/derived statistical constants: chi2 critical value at df=3, the
  # Nemenyi studentised-range quantile for k=4, the resulting critical
  # difference and its radical term. Fixed by the test, not by these data.
  "7.815", "7.81", "2.569", "1.211", "0.4714",
  # Anchors' effective precision threshold tau: a protocol setting.
  "0.95",
  # Chapter 6 sweep (2026-09-02). Decision thresholds and protocol settings:
  # the ICC acceptability cut-point, the Gaussian perturbation scale, and the
  # lowest kernel_width probed in the Appendix C sweep. Plus the size of the
  # Adult corpus, a property of the dataset rather than a result.
  "0.75", "0.1", "0.25", "48842",
  # r = 1.0 between education and education-num is definitional: the
  # supplementary states the two columns are functionally identical.
  "1.0",
  # Mantissas of Holm-adjusted p-values already registered by magnitude
  # elsewhere; the exponent carries the claim, not the mantissa.
  "1.51", "2.29", "1.18", "2.64",
  # Nemenyi mean-rank differences: arithmetic on the registered mean ranks
  # (friedman.*.rank.*), not independent measurements.
  "2.200", "2.800", "1.200", "1.800", "0.600",
  "2.400", "2.600", "1.400", "1.600", "0.200",
]

