# Manuscript claim registry -- single source of truth for numeric claims.
#
# Verified by scripts/pubs/verify_claims.py, which (a) re-derives every `value`
# from the committed artifacts via `source`, (b) confirms the literal text is
# still present in each manuscript listed under `appears_in`, and (c) fails if
# any `[[retired]]` value reappears.
#
# Created after the 2026-08-22/23 tri-document alignment audit (RCA-001), whose
# thirteen findings all reduced to the same cause: numbers reached the
# manuscripts by hand and nothing ever re-derived them.
#
# Adding a claim: pick the resolver in scripts/pubs/claim_sources.py that
# matches the aggregation the manuscript actually uses. Block-level and
# run-level means differ for Anchors and DiCE, whose grid coverage is
# incomplete -- registering the wrong one produces a false failure.

[meta]
version = 1
rca = "RCA-001"

