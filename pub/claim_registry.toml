# ---------------------------------------------------------------------------
# Review corpus distributions as stated by each manuscript.
# Checked with: python scripts/pubs/check_review_corpus.py --corpus <csv> --expect <key>
# ---------------------------------------------------------------------------

[review_corpus.paper_bc]
# Matches the reconstructed corpus released 2026-08-26 and the figures now
# printed in tab:prisma, tab:corpus_profile and the Gap sections. If the coding
# changes, change the manuscript and this block together -- never this alone.
size = 44
clusters = { faithfulness_robustness = 15, taxonomy_survey = 10, human_grounded = 7, benchmark_toolkit = 6, llm_judge = 4, counterfactual_recourse = 2 }
evidence_sources = { proxy = 21, human_expert = 15, benchmark = 13, end_user = 12, llm_judge = 4 }
confidence = { high = 44 }

[review_corpus.paper_c]
# Satisfied by docs/reports/paper_c/paper_c_review_corpus.csv.
size = 24

