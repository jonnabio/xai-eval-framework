[meta]
version = 1

[thesis]
title = "Arquitectura Agnóstica para la Interpretabilidad de Modelos de Inteligencia Artificial de Caja Negra: Integración de Benchmarking Técnico, Protocolo Reproducible (FOM-7) y Taxonomía de Métricas"

resumen_es = """
Esta tesis propone un marco de evaluación multinivel para la Inteligencia Artificial Explicable (XAI) orientado a comparar métodos agnósticos al modelo bajo condiciones de benchmarking controladas y reproducibles. El trabajo responde a la fragmentación evaluativa del campo articulando tres componentes complementarios: (i) un protocolo de operación reproducible de siete puertas (FOM-7) que conecta diseño experimental, calificación de artefactos e inferencia estadística admisible; (ii) un benchmark cuantitativo multi-métrico sobre datos tabulares reales que evalúa SHAP, LIME, Anchors y DiCE en cinco familias de modelos; y (iii) una taxonomía estructurada del espacio de métricas de evaluación XAI organizada en cuatro ejes (objetivo de evaluación, fuente de evidencia, propiedad de calidad y contexto de tarea), que hace explícitas tres brechas de constructo del campo.

El estudio empírico se realiza sobre el conjunto Adult (UCI Adult Income) y operacionaliza cinco métricas primarias: fidelidad, estabilidad, parsimonia, brecha de fidelidad (*faithfulness gap*) y coste computacional. La inferencia confirmativa se apoya en comparaciones no paramétricas sobre 15 bloques con control de multiplicidad y en un análisis pareado SHAP–LIME que cuantifica el trade-off calidad–coste. Los resultados muestran diferencias grandes y consistentes entre métodos: SHAP alcanza la mejor fidelidad y estabilidad medias, con tamaños de efecto muy grandes frente a LIME (d_z = 4.82 en fidelidad y d_z = 3.00 en estabilidad), si bien la ventaja no es uniforme entre familias de modelos. LIME resulta competitivo cuando la latencia es crítica, a costa de una inestabilidad severa bajo la configuración y el espacio de características evaluados; se trata de una propiedad del par (configuración, espacio de características) y no de una propiedad universal del método. Anchors y DiCE responden a objetivos explicativos cualitativamente distintos a la atribución de características. Una validación cruzada sobre dos conjuntos de datos adicionales replica el ordenamiento de fidelidad entre SHAP y Anchors, delimitando el alcance externo de los hallazgos.

Un estudio complementario evalúa si jueces basados en modelos de lenguaje pueden sostener la evaluación semántica de explicaciones. El resultado es negativo: la concordancia inter-juez, medida como ICC(1,1), se sitúa entre 0.321 y 0.601 según la dimensión evaluada, sin alcanzar el umbral exigible para sustentar afirmaciones confirmativas, por lo que su uso queda acotado a un papel exploratorio y de calibración instrumental. En conjunto, la tesis aporta un protocolo portable, evidencia comparativa cuantificada con sus condiciones de validez explícitas y un marco conceptual que permiten seleccionar métodos XAI en función de objetivos operativos y acumular evidencia de forma reproducible.
"""

palabras_clave_es = [
  "inteligencia artificial explicable (XAI)",
  "evaluación multimétrica",
  "benchmarking reproducible",
  "protocolo FOM-7",
  "atribución de características",
  "explicaciones contrafactuales",
  "datos tabulares",
]

abstract_en = """
This thesis proposes a multilevel evaluation framework for Explainable Artificial Intelligence (XAI) aimed at comparing model-agnostic explainers under controlled and reproducible benchmarking conditions. To address the evaluation fragmentation in the field, the framework integrates three complementary components: (i) a seven-gate operational protocol (FOM-7) that links experimental design, artifact qualification, and statistically admissible inference; (ii) a multi-metric quantitative benchmark on real-world tabular data evaluating SHAP, LIME, Anchors, and DiCE across five model families; and (iii) a structured taxonomy of XAI evaluation metrics organized along four axes (evaluation target, evidence source, quality property, and task context), which makes three of the field's construct gaps explicit.

The empirical study uses the Adult (UCI Adult Income) dataset and operationalizes five primary metrics: faithfulness, stability, parsimony, faithfulness gap, and computational cost. Confirmatory inference relies on nonparametric comparisons over 15 blocks with multiplicity control and on a paired SHAP-LIME analysis quantifying the quality-cost trade-off. Results show large and consistent differences across methods: SHAP attains the best mean faithfulness and stability, with very large effect sizes over LIME (d_z = 4.82 for faithfulness and d_z = 3.00 for stability), although the advantage is not uniform across model families. LIME remains attractive when latency constraints dominate, at the cost of severe instability under the configuration and feature space evaluated; this is a property of the (configuration, feature space) pair rather than a universal property of the method. Anchors and DiCE address qualitatively different explanatory objectives than feature attribution. A cross-dataset check on two further datasets replicates the SHAP-over-Anchors faithfulness ordering, delimiting the external scope of the findings.

A complementary study evaluates whether language-model judges can sustain the semantic evaluation of explanations. The result is negative: inter-judge agreement, measured as ICC(1,1), ranges from 0.321 to 0.601 depending on the dimension, falling short of the threshold required to support confirmatory claims, which confines such judges to an exploratory, instrument-calibration role. Overall, the thesis contributes a portable protocol, quantified comparative evidence with its validity conditions made explicit, and a conceptual framework to support operationally grounded XAI method selection and reproducible evidence accumulation.
"""

keywords_en = [
  "explainable AI (XAI)",
