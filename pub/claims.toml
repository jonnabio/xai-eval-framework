  "tabular data",
]

[papers.paper_a]
abstract_en_tex = """
Evaluating explainability methods requires more than a single faithfulness proxy. We present a modular benchmarking framework centered on quantitative XAI quality metrics: fidelity, stability, sparsity, computational cost, and faithfulness gap, plus an explicit method for operating the framework end-to-end. On the UCI Adult benchmark, we use a staged evidence protocol: a calibration/reproducibility stage (EXP1) followed by a primary comparative/robustness benchmark (EXP2); the current merged recovery snapshot contains 299 committed result artifacts (99.7\\% artifact coverage) plus a 30-row SHAP recovery batch, yielding 275 analyzable unique runs out of 300 planned cells (91.7\\%). Across complete model-size blocks ($5$ models, $N \\in \\{50,100,200\\}$), Friedman tests indicate significant method differences for fidelity ($\\chi^2=42.12$, $p=3.78\\times10^{-9}$), stability ($\\chi^2=40.68$, $p=7.65\\times10^{-9}$), sparsity ($\\chi^2=35.64$, $p=8.92\\times10^{-8}$), faithfulness gap ($\\chi^2=45.00$, $p=9.25\\times10^{-10}$), and runtime ($\\chi^2=30.44$, $p=1.12\\times10^{-6}$). SHAP leads on fidelity/stability, DiCE leads on sparsity, and LIME remains fastest overall. We release the framework, operation protocol, and artifacts with explicit data-quality caveats for reproducible benchmark use under a quantitative-only claim scope.
"""
keywords_en_tex = "Explainable AI, benchmark methodology, reproducibility, statistical evaluation, model-agnostic explanations"

[papers.paper_bc]
abstract_en_tex = """
Evaluation of post-hoc explanations in machine learning remains fragmented
across incompatible metric families, yielding method comparisons that are
sensitive to which endpoints are chosen. We address this through two
complementary contributions. First, drawing on a 44-paper structured
scoping corpus assembled through a documented five-database search and
transparent screening record, we build a four-axis taxonomy---by
evaluation target, evidence source, quality property, and task
context---that maps the measurement landscape and exposes three recurring
gaps: proxy metrics dominate despite not
capturing semantics; human-grounded constructs remain underspecified; and
semantic evaluation is growing faster than its empirical validation base.
Second, we fill the proxy-layer gap with a paired empirical benchmark
comparing LIME and SHAP across 75 matched cells spanning five model
families, five seeds, and three sampling sizes on the Adult tabular
benchmark. Within this protocol, results are consistent and large in
magnitude: SHAP dominates all measured quality endpoints (stability
$d_z{=}3.00$, fidelity $d_z{=}4.82$, faithfulness gap $d_z{=}2.63$),
while LIME is faster for non-tree model families (median 53.3 ms vs.\\ 694.6 ms
for SHAP); for tree-based models, SHAP's \texttt{TreeExplainer}
reverses this ordering. A tabular cross-dataset
extension on two additional datasets provides partial support for the
fidelity direction, but does not establish cross-modal generality.
Together, the taxonomy and the benchmark motivate a
model-architecture-conditioned deployment pattern for tabular
classification: SHAP is preferred at both fidelity and latency for
tree-based models, while LIME retains a latency advantage for black-box
architectures lacking a model-aware explainer. All experimental artifacts
are publicly available.
"""
keywords_en_tex = "explainable AI, evaluation metrics, taxonomy, LIME, SHAP"

[papers.paper_b]
abstract_en_tex = """
LIME and SHAP are widely used explainability methods, yet guidance on when each is preferable remains limited and often anecdotal. This paper presents a focused paired empirical comparison of the two methods on tabular data using five primary technical metrics under a controlled benchmarking protocol. Across 75 matched SHAP-LIME cells, SHAP dominates on stability, fidelity, and faithfulness gap, while LIME yields systematically sparser explanations and lower runtime in most contexts. The cost trade-off is statistically significant but heterogeneous across model families: matched-cell medians are 684.1 ms for SHAP versus 65.7 ms for LIME, whereas means are 11,708.3 ms versus 3,660.7 ms because kernel-SHAP tails are heavy. These findings support objective-driven deployment guidance: SHAP for high-assurance auditing and LIME for latency-sensitive user-facing explanation workflows.
"""
keywords_en_tex = "explainable ai, lime, shap, interpretability, robustness benchmarking"

[papers.paper_c]
abstract_en_tex = """
Evaluation remains the least consolidated part of explainable artificial intelligence (XAI). While model-agnostic post-hoc methods such as LIME, SHAP, Anchors, and DiCE are widely used, the criteria used to judge them vary sharply across papers, toolkits, and application domains. Some studies emphasize faithfulness proxies, others prioritize stability, sparsity, or human plausibility, and newer work introduces large language models (LLMs) as semantic evaluators without a unified framework for locating those judgments within the broader evaluation landscape. This paper presents a structured survey and taxonomy of evaluation metrics for model-agnostic explainability, focusing on how technical proxy metrics, benchmark-grounded metrics, human evaluation, and LLM-based semantic evaluation relate to one another. Using a cleaned 24-study coded review corpus derived from the thesis literature matrix, we organize XAI evaluation along four axes: evaluation target, evidence source, quality property, and task context. The resulting taxonomy clarifies where current metrics overlap, where they leave construct gaps, and why semantic evaluation should be treated as a complementary layer rather than a replacement for robustness- and fidelity-oriented measurement. The paper closes by mapping the taxonomy back to the thesis framework, motivating the benchmark design of Paper B and the evaluator-validation agenda of Paper A.
"""
keywords_en_tex = "explainable ai, evaluation metrics, survey, taxonomy, semantic evaluation, llm-as-a-judge"

