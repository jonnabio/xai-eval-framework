]

abstract_en = """
This thesis proposes a multilevel evaluation framework for Explainable Artificial Intelligence (XAI) aimed at comparing model-agnostic explainers under controlled and reproducible benchmarking conditions. To address the evaluation fragmentation in the field, the framework integrates three complementary components: (i) a seven-gate operational protocol (FOM-7) that links experimental design, artifact qualification, and statistically admissible inference; (ii) a multi-metric quantitative benchmark on real-world tabular data evaluating SHAP, LIME, Anchors, and DiCE across five model families; and (iii) a structured taxonomy of XAI evaluation metrics organized along four axes (evaluation target, evidence source, quality property, and task context), which makes three of the field's construct gaps explicit.

The empirical study uses the Adult (UCI Adult Income) dataset and operationalizes five primary metrics: faithfulness, stability, parsimony, faithfulness gap, and computational cost. Confirmatory inference relies on nonparametric comparisons over 15 blocks with multiplicity control and on a paired SHAP-LIME analysis quantifying the quality-cost trade-off. Results show large and consistent differences across methods: SHAP attains the best mean faithfulness and stability, with very large effect sizes over LIME (d_z = 4.82 for faithfulness and d_z = 3.00 for stability), although the advantage is not uniform across model families. LIME remains attractive when latency constraints dominate, at the cost of severe instability under the configuration and feature space evaluated; this is a property of the (configuration, feature space) pair rather than a universal property of the method. Anchors and DiCE address qualitatively different explanatory objectives than feature attribution. A cross-dataset check on two further datasets replicates the SHAP-over-Anchors faithfulness ordering, delimiting the external scope of the findings.

A complementary study evaluates whether language-model judges can sustain the semantic evaluation of explanations. The result is negative: inter-judge agreement, measured as ICC(1,1), ranges from 0.321 to 0.601 depending on the dimension, falling short of the threshold required to support confirmatory claims; a second cohort, with a different judge panel on the same cases, reproduces this result in the primary condition. This confines such judges to an exploratory, instrument-calibration role. Overall, the thesis contributes a portable protocol, quantified comparative evidence with its validity conditions made explicit, and a conceptual framework to support operationally grounded XAI method selection and reproducible evidence accumulation.
"""

keywords_en = [
  "explainable AI (XAI)",
  "multi-metric evaluation",
  "reproducible benchmarking",
  "FOM-7 protocol",
  "feature attribution",
  "counterfactual explanations",
  "tabular data",
]

[papers.paper_a]
abstract_en_tex = """
Evaluating explainability methods requires more than a single faithfulness proxy. We present a modular benchmarking framework centered on quantitative XAI quality metrics: fidelity, stability, sparsity, computational cost, and faithfulness gap, plus an explicit method for operating the framework end-to-end. On the UCI Adult benchmark, we use a staged evidence protocol: a calibration/reproducibility stage (EXP1) followed by a primary comparative/robustness benchmark (EXP2); the current merged recovery snapshot contains 299 committed result artifacts (99.7\\% artifact coverage) plus a 30-row SHAP recovery batch, yielding 275 analyzable unique runs out of 300 planned cells (91.7\\%). Across complete model-size blocks ($5$ models, $N \\in \\{50,100,200\\}$), Friedman tests indicate significant method differences for fidelity ($\\chi^2=42.12$, $p=3.78\\times10^{-9}$), stability ($\\chi^2=40.68$, $p=7.65\\times10^{-9}$), sparsity ($\\chi^2=35.64$, $p=8.92\\times10^{-8}$), faithfulness gap ($\\chi^2=45.00$, $p=9.25\\times10^{-10}$), and runtime ($\\chi^2=30.44$, $p=1.12\\times10^{-6}$). SHAP leads on fidelity/stability, DiCE leads on sparsity, and LIME remains fastest overall. We release the framework, operation protocol, and artifacts with explicit data-quality caveats for reproducible benchmark use under a quantitative-only claim scope.
"""
keywords_en_tex = "Explainable AI, benchmark methodology, reproducibility, statistical evaluation, model-agnostic explanations"

# Paper B+C, Inteligencia Artificial (IBERAMIA) edition (2026-10-02). The
# journal requires an English abstract and a Spanish "Resumen", English
# keywords and optional Spanish ones; it sets no length limit. The text is the
# PeerJ structured abstract with its headings removed: same sentences, same
# numbers. Earlier versions: tag tmlr-submission-12779 (TMLR) and git history
# (PeerJ). Every LaTeX backslash is doubled (RCA-003).
[papers.paper_bc]
abstract_en_tex = """
Evaluation of post-hoc explanations in machine learning
remains fragmented across incompatible metric families, yielding method
comparisons that are sensitive to which endpoints are chosen.
Drawing on a 44-paper structured scoping corpus assembled
through a five-database search with a reported screening record, we build a
four-axis taxonomy---by evaluation target, evidence source, quality property,
and task context---that maps the measurement landscape. We then run a paired
empirical benchmark comparing LIME and SHAP across 75 matched cells spanning
five model families, five seeds, and three sampling sizes on the UCI Adult
census-income dataset, with a cross-dataset extension on two further tabular
datasets.
The taxonomy exposes three recurring gaps: proxy metrics
dominate despite not capturing semantics; human-grounded constructs remain
underspecified; and semantic evaluation is growing faster than its empirical
validation base. Within the benchmark protocol, results are consistent and
large in magnitude: SHAP leads on every fidelity- and stability-oriented
endpoint (stability $d_z{=}3.00$, fidelity $d_z{=}4.82$, faithfulness gap
$d_z{=}2.63$), while LIME is sparser and faster for non-tree model families
(median 53.3 ms vs.\\ 694.6 ms for SHAP). Among tree ensembles the latency
ordering depends on the model: SHAP's \\texttt{TreeExplainer} was faster
than LIME in every XGBoost cell but slower in every random-forest cell. The
cross-dataset extension preserves the fidelity ordering---SHAP exceeds both
Anchors and LIME in every dataset--model stratum---and shows that LIME's
near-zero stability on the Adult data is not intrinsic to the method: it rises
with the kernel width and is high on both lower-dimensional datasets.
Together, the taxonomy and the benchmark motivate a
model-architecture-conditioned deployment pattern for tabular
classification: SHAP is preferred at both fidelity and latency for
XGBoost, LIME retains a latency advantage for black-box architectures
lacking a model-aware explainer, and for other tree ensembles latency
should be measured before choosing. All experimental artifacts
are publicly available.
"""
keywords_en_tex = "explainable AI, evaluation metrics, taxonomy, LIME, SHAP"
# Spanish translation of abstract_en_tex: same claims, same numbers (decimal
# point, as in the thesis Resumen). Terms follow the thesis: parsimonia,
# brecha de fidelidad (faithfulness gap).
abstract_es_tex = """
La evaluación de las explicaciones post hoc en aprendizaje automático sigue
fragmentada entre familias de métricas incompatibles, lo que produce
comparaciones entre métodos sensibles a la elección de los criterios de
evaluación. A partir de un corpus de revisión exploratoria estructurada de 44
artículos, reunido mediante una búsqueda en cinco bases de datos con un
registro de cribado documentado, construimos una taxonomía de cuatro
ejes---objetivo de evaluación, fuente de evidencia, propiedad de calidad y
contexto de la tarea---que organiza el panorama de la medición. A
continuación, realizamos una comparación empírica pareada de LIME y SHAP en 75
celdas emparejadas que abarcan cinco familias de modelos, cinco semillas y tres
tamaños de muestra sobre el conjunto de datos censal UCI Adult, con una
extensión a otros dos conjuntos de datos tabulares. La taxonomía revela tres
brechas recurrentes: las métricas proxy predominan aunque no capturan la
semántica; los constructos basados en el juicio humano siguen insuficientemente
especificados; y la evaluación semántica crece más rápido que su base de
validación empírica. Dentro del protocolo de comparación, los resultados son
consistentes y de gran magnitud: SHAP aventaja a LIME en todos los criterios
orientados a la fidelidad y la estabilidad (estabilidad $d_z{=}3.00$,
fidelidad $d_z{=}4.82$, brecha de fidelidad $d_z{=}2.63$), mientras que LIME
es más parsimonioso y más rápido en las familias de modelos no basadas en
árboles (mediana de 53.3 ms frente a 694.6 ms de SHAP). En los ensambles de
árboles, el orden de latencia depende del modelo: el \\texttt{TreeExplainer} de
SHAP fue más rápido que LIME en todas las celdas de XGBoost, pero más lento en
todas las de bosque aleatorio. La extensión a otros conjuntos de datos conserva
el orden de fidelidad---SHAP supera tanto a Anchors como a LIME en todos los
estratos de conjunto de datos y modelo---y muestra que la estabilidad casi nula
de LIME en los datos de Adult no es intrínseca al método: aumenta con el ancho
del kernel y es alta en ambos conjuntos de menor dimensión. En conjunto, la
taxonomía y la comparación empírica motivan un patrón de despliegue
condicionado por la arquitectura del modelo para la clasificación tabular: SHAP
es preferible tanto en fidelidad como en latencia para XGBoost, LIME conserva
una ventaja de latencia en arquitecturas de caja negra sin un explicador
específico del modelo, y en otros ensambles de árboles la latencia debe medirse
antes de elegir. Todos los artefactos experimentales están disponibles
públicamente.
"""
keywords_es_tex = "IA explicable, métricas de evaluación, taxonomía, LIME, SHAP"

# Paper B, CLEI Electronic Journal edition (ADR-0022): the 13-page paired
# SHAP-LIME paper. The journal limits the abstract to 200 words.
[papers.paper_b]
abstract_en_tex = """
LIME and SHAP are the most widely used model-agnostic explainers for tabular
models, yet controlled paired comparisons of the two remain scarce. This
paper extends an earlier paired test to the full grid of a public benchmark:
75 cells that share model, seed and sample size, over five model families on
the UCI Adult census-income dataset, with Holm-corrected paired tests and
effect sizes for five endpoints. SHAP leads on stability ($d_z{=}3.00$),
fidelity ($d_z{=}4.82$) and faithfulness gap ($d_z{=}2.63$), and LIME gives
sparser explanations. Two results depend on conditions that are usually left
implicit. First, the latency ordering depends on the model family: SHAP's
\\texttt{TreeExplainer} was faster than LIME in every XGBoost cell and slower
in every random-forest cell, and LIME was faster for non-tree models (median
53.3 ms vs.\\ 694.6 ms). Second, LIME's near-zero stability on Adult is not a
fixed property of the method: it is high on two further tabular datasets
and, in a single-model probe, rises with the kernel width. The results support choosing the explainer
according to the model architecture and the latency budget, and they show
that a ranking obtained on one dataset and one configuration does not
transfer by default. All artifacts are public.
"""
keywords_en_tex = "explainable artificial intelligence, LIME, SHAP, explanation evaluation, benchmarking"

# Paper C (ADR-0022, amendment of 2026-10-04): the LLM-judge reliability study with
# the taxonomy as framing, in docs/reports/paper_c/. This table is written by
# scripts/pubs/register_paper_c.py from the generated paper_c.tex (the manuscript
# fills its abstract from result files, so it cannot \\input a fragment); do not
# edit it by hand. Tecnologia en Marcha limits each abstract to 250 words.
[papers.paper_c]
abstract_en_tex = """
Large language models (LLMs) are used as judges of the quality of explanations. That
use assumes that different judges give the same
explanation the same score. This study measures that agreement. Three LLM judges scored
192 post-hoc explanations (SHAP, LIME, Anchors, DiCE; three tabular
datasets) on seven dimensions with a 1--5 rubric, in two panels of different models. The
second panel also varied the prompt, repeated every call three times and scored the cases
again without metrics or outcome
(5,760 calls). Agreement was measured with the intraclass
correlation ICC(1,1). Over all cases no dimension reached 0.75 in either panel (highest
values 0.601 and 0.731). But up to
67\\% of the score variance lay between explanation
methods. Among SHAP cases no dimension exceeded
0.22 and the scores hardly varied. Among LIME cases five
dimensions exceeded 0.6, but only through five records whose weights
all printed as zero; without them the highest of the five was
0.33. The mean of the three judges was reliable for separating
methods, not explanations. With the metrics in the prompt the overall score followed
fidelity within every method, and one judge named a metric in
80\\% of its answers. Without them that judge
scored higher, the correlation vanished for SHAP and DiCE, and agreement on audit
usefulness fell from 0.66 to
0.42. A single LLM judge of this class should
not be used as a confirmatory measure. Studies using them should report
agreement within method, the number of calls and what the prompt contained.
"""
keywords_en_tex = "explainable artificial intelligence; LLM-as-a-judge; inter-rater reliability; explanation evaluation; intraclass correlation"
