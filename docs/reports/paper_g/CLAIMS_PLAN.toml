# Paper G: planned evidence claims (RCA-001). NOT registered, NOT verified.
#
# pub/claim_registry.toml admits a claim only with a value re-derived from a committed artifact,
# so no Paper G claim can enter it before the authorized analysis writes its outputs. This file
# fixes in advance which number each planned claim will be and where it will come from. After the
# single authorized run, the claims are registered as Paper F's were (a register script reading
# these selectors), and each manuscript site is listed under `appears_in` then.
#
# A selector reads one cell: `artifact` (under outputs/analysis/paper_g/), the row where column
# `key` equals `value`, and column `column`. tests/analysis/test_paper_g_analyze.py checks that
# every selector resolves to exactly one number on a constructed analysis.

[meta]
status = "planned; not verified; no value exists"
frozen_plan = "74a7fdf4e"                  # ANALYSIS_PLAN.md sections 1-10, before the run
amendments = "b993f434d"                   # section 11, after the run, before unblinding
implementation = "scripts/paper_g_analyze.py"
tests = "tests/analysis/test_paper_g_analyze.py"

