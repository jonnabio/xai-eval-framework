# Paper G: reference list. Each entry names the claim of the manuscript it supports.
# `title`, `first` (first author's family name) and `year` are what the manuscript states;
# scripts/verify_references.py checks them against the record the DOI resolves to (doi.org,
# CSL JSON) and writes reference_records.json and generated/references.json (for pandoc).
# `foundational = true` marks the pre-2024 sources kept because they define a method used.
# Entries with `own = true` are earlier papers of the programme, unpublished at writing; they
# are cited in the third person and anonymised for double-blind review (no DOI yet).

