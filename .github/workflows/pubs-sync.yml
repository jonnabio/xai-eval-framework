name: pubs-sync

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate fragments
        run: python3 scripts/pubs/generate_fragments.py

      - name: Verify wiring
        run: python3 scripts/pubs/verify_sync.py

      - name: Verify manuscript claims against artifacts
        run: python3 scripts/pubs/verify_claims.py

      - name: Verify review corpus matches the manuscript
        run: |
          python3 scripts/pubs/check_review_corpus.py --corpus docs/reports/paper_bc/paper_bc_review_corpus.csv --expect paper_bc
          python3 scripts/pubs/check_review_corpus.py --corpus docs/reports/paper_c/paper_c_review_corpus.csv --expect paper_c

      - name: Ensure fragments are up to date
        run: |
          # build_meta.env records the absolute path and mtime of claims.toml,
          # so it differs on every machine; nothing reads it back.
          git diff --exit-code -- pub/fragments ':!pub/fragments/build_meta.env'

  exp4-reconstruction:
    # Checks the reconstructed EXP4 sources against the hash pins recorded from
    # the 2026-08-28 bytecode verification (the bytecode was lost 2026-09-27).
    # 3.13 so the bytecode comparison can run if the .pyc files ever return.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify reconstructed EXP4 sources match their verified hash pins
        run: python3 scripts/pubs/verify_exp4_reconstruction.py

