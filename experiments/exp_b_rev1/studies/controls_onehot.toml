# Study 'controls_onehot' of Paper B revision 1 (cohort B2).
# GENERATED by scripts/paper_b_studies.py from cohort.toml: do not edit by hand.
# Run with PAPER_B_CONFIG=<this file> (see the script's docstring).

[cohort]
name = "B2-controls_onehot"
split_seed = 42
test_size = 0.2
max_train_rows = 20000

[seeds]
adult = [11, 22, 33]
other = [11, 22, 33]

[sampling]
per_stratum = 25
stability_per_stratum = 3
stability_only = true

[metrics]
stability_T = 15
stability_sigma = 0.1
fidelity_top_k = 5
sparsity_threshold = 0.0001
store_vectors = true
vector_digits = 6
stability_noise = "onehot_valid"
onehot_resample_p = 0.1

[datasets.adult]
loader = "src_adult"
role = "main"

[models.logreg]
class = "sklearn.linear_model.LogisticRegression"
params = { solver = "lbfgs", max_iter = 1000, random_state = 42 }

[models.rf]
class = "sklearn.ensemble.RandomForestClassifier"
params = { n_estimators = 100, max_depth = 15, random_state = 42, n_jobs = 1 }

[models.xgb]
class = "xgboost.XGBClassifier"
params = { n_estimators = 100, max_depth = 6, learning_rate = 0.1, objective = "binary:logistic", eval_metric = "logloss", random_state = 42, n_jobs = 1 }

[models.svm]
class = "sklearn.svm.SVC"
params = { C = 1.0, kernel = "rbf", probability = true, random_state = 42 }

[models.mlp]
class = "sklearn.neural_network.MLPClassifier"
params = { hidden_layer_sizes = [100], max_iter = 500, random_state = 42 }

[explainers.shap]
method = "shap"
n_background_samples = 50
kernel_nsamples = 500
kernel_nsamples_by_model = {  }

[explainers.lime]
method = "lime"
num_samples = 1000
num_features = 10
kernel_width = "default"

[explainers.lime_full]
method = "lime"
num_samples = 1000
num_features = "all"
kernel_width = "default"

[explainers.anchors]
method = "anchors"
threshold = 0.95

[explainers.dice]
method = "dice"
num_counterfactuals = 1

[resources]
max_workers = 6
ram_reserve_gb = 6.0
default_peak_gb = 3.0
worker_cap_gb = 8.0
pause_admission_below_gb = 3.0
kill_newest_below_gb = 1.5
disk_min_gb = 10.0
disk_pause_gb = 5.0
instance_time_limit_s = 3600
job_start_limit_s = 1800
max_retries = 3
below_normal_priority = true

[timing]
per_stratum = 5
repeats = 3
warmup_per_explainer = 1
max_other_cpu_percent = 10.0
require_idle_minutes = 5
gate_poll_s = 30
cpu = 2
benchmark_every_instances = 1

[sync]
branch = "paper/b-rev1-runs"
remote = "origin"
every_minutes = 15
results_prefix = "experiments/exp_b_rev1/studies_results/controls_onehot"
also_push = []
max_file_mb = 50
