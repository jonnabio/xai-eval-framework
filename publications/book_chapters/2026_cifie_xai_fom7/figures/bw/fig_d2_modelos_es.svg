   <g id="text_2">
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.511811" y="154.292312" transform="rotate(-0 205.511811 154.292312)">Explicación post-hoc: una aproximación sometida a prueba, no transparencia recuperada</text>
   </g>
   <g id="line2d_4">
    <path d="M 7.086614 203.244094 
L 204.094488 203.244094 
" clip-path="url(#pef3320ab25)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="line2d_5">
    <path d="M 206.929134 203.244094 
L 403.937008 203.244094 
" clip-path="url(#pef3320ab25)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_3">
    <text style="fill: #4a4a4a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(8.503937 284.784742)">Agnosticidad y especificidad son decisiones de diseño, no calificaciones de calidad. Si un modelo interpretable ofrece un</text>
    <text style="fill: #4a4a4a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(8.503937 292.39033)">desempeño adecuado, conviene considerarlo antes que una caja negra con explicación aproximada.</text>
   </g>
   <g id="text_4">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="70.866142" y="41.87052" transform="rotate(-0 70.866142 41.87052)">Interpretables por diseño</text>
   </g>
   <g id="text_5">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 59.135518)">Reglas breves, árboles poco</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 67.899743)">profundos y modelos aditivos con</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 76.663968)">componentes controlados.</text>
   </g>
   <g id="text_6">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.511811" y="41.890379" transform="rotate(-0 205.511811 41.890379)">Interpretabilidad frágil</text>
   </g>
   <g id="text_7">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(147.401575 59.135518)">Un árbol extenso o una regla con</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(147.401575 67.904552)">numerosas excepciones deja de</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(147.401575 76.668777)">ser comprensible en la práctica.</text>
   </g>
   <g id="text_8">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="340.15748" y="41.86027" transform="rotate(-0 340.15748 41.86027)">Cajas negras</text>
   </g>
   <g id="text_9">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(282.047244 59.135518)">Ensambles de árboles, máquinas</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(282.047244 67.885493)">de vectores soporte con kernel y</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(282.047244 76.649718)">redes neuronales.</text>
   </g>
   <g id="text_10">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="105.590551" y="196.378568" transform="rotate(-0 105.590551 196.378568)">Agnóstica al modelo</text>
   </g>
   <g id="text_11">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 213.623707)">Consulta entradas y salidas sin acceder a</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 222.387932)">parámetros internos. Portable entre familias de</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 231.137907)">modelos; solo observa el comportamiento accesible</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 239.887882)">mediante sus consultas.</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(12.755906 248.642666)">Ejemplos: LIME, KernelSHAP, Anchors, DiCE.</text>
   </g>
   <g id="text_12">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="305.433071" y="196.386255" transform="rotate(-0 305.433071 196.386255)">Específica del modelo</text>
   </g>
   <g id="text_13">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(212.598425 213.623707)">Aprovecha gradientes, activaciones o la estructura</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(212.598425 222.387932)">de los árboles. Puede ser más eficiente o precisa</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(212.598425 231.137907)">dentro de una familia, pero es menos transferible.</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(212.598425 239.892691)">Ejemplo: TreeSHAP para modelos de árboles.</text>
   </g>
