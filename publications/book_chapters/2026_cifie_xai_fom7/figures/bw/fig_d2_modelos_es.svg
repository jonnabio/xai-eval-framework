   <g id="text_1">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.511811" y="10.549039" transform="rotate(-0 205.511811 10.549039)">Dificultad de una audiencia para comprender el modelo directamente</text>
   </g>
