   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #1a1a1a" x="205.511811" y="34.983862" transform="rotate(-0 205.511811 34.983862)">modelo, datos, proceso y contexto de uso</text>
   </g>
   <g id="line2d_1">
