   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(19.283793 94.067014)">¿Qué elementos del sistema son</text>
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(56.432355 103.632697)">visibles?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(13.322835 124.411221)">Visibilidad de la estructura,</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(13.322835 133.766791)">los datos, los supuestos, la</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(13.322835 143.295143)">documentación, las versiones y</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(13.322835 152.837744)">las responsabilidades.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start; fill: #1a1a1a" x="17.007874" y="189.711487" transform="rotate(-0 17.007874 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(17.007874 201.651008)">Publicar documentación no</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(17.007874 209.009352)">demuestra que una explicación</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(17.007874 217.048758)">individual refleje con exactitud</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(17.007874 225.788352)">la salida.</text>
   </g>
   <g id="line2d_2">
    <path d="M 142.582677 79.653543 
L 268.724409 79.653543 
" clip-path="url(#p0c456d94d3)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(158.607168 94.067014)">¿Qué puede comprender una</text>
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(162.232606 102.872104)">audiencia, para una tarea?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(148.818898 124.231315)">Relación por la que una</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(148.818898 133.766791)">audiencia comprende aspectos</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(148.818898 144.062862)">relevantes del funcionamiento o</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(148.818898 153.598338)">de la salida del sistema.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start; fill: #1a1a1a" x="152.503937" y="189.711487" transform="rotate(-0 152.503937 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(152.503937 200.963571)">Un modelo sencillo para una</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(152.503937 209.009352)">persona experta puede ser opaco</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(152.503937 217.055133)">para otra audiencia.</text>
   </g>
