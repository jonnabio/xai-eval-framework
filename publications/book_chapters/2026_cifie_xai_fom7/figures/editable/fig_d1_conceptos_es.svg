" clip-path="url(#p0c456d94d3)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(290.4107 94.067014)">¿Qué procedimientos producen</text>
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(302.165763 102.897635)">comprensión o razones?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(284.314961 124.22419)">Procedimientos y artefactos que</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(284.314961 133.766791)">intentan producir esa</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(284.314961 143.302268)">comprensión o aportar razones</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(284.314961 153.598338)">examinables.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start; fill: #1a1a1a" x="288" y="189.711487" transform="rotate(-0 288 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(288 200.963571)">Una explicación post-hoc no</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(288 209.009352)">vuelve transparente el modelo:</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(288 217.055133)">aproxima una parte de su</text>
    <text style="font-style: italic; font-size: 6.8px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(288 224.901696)">comportamiento.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(56.096405 274.382911)">Ninguna de las tres equivale a confiabilidad: esta depende además de validez, seguridad, robustez,</text>
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1a1a1a" transform="translate(153.282592 283.711095)">privacidad, equidad y gobernanza.</text>
   </g>
