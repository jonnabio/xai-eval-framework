   <g id="text_1">
    <text style="fill: #1e3a8a; font: 700 9.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.511811" y="22.471543" transform="rotate(-0 205.511811 22.471543)">Sistema de IA</text>
   </g>
   <g id="text_2">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.511811" y="34.984011" transform="rotate(-0 205.511811 34.984011)">modelo, datos, proceso y contexto de uso</text>
   </g>
   <g id="line2d_1">
    <path d="M 7.086614 79.653543 
L 133.228346 79.653543 
" clip-path="url(#pedffc448f9)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_3">
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(19.283793 93.076453)">¿Qué elementos del sistema son</text>
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(56.432355 101.258803)">visibles?</text>
   </g>
   <g id="text_4">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(13.322835 122.915045)">Visibilidad de la estructura,</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(13.322835 131.823338)">los datos, los supuestos, la</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(13.322835 140.73163)">documentación, las versiones y</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(13.322835 149.654173)">las responsabilidades.</text>
   </g>
   <g id="text_5">
    <text style="fill: #991b1b; font: 700 6.8px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start" x="17.007874" y="189.711487" transform="rotate(-0 17.007874 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_6">
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(17.007874 200.028837)">Publicar documentación no</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(17.007874 207.621674)">demuestra que una explicación</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(17.007874 215.214512)">individual refleje con exactitud</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(17.007874 222.820099)">la salida.</text>
   </g>
   <g id="line2d_2">
    <path d="M 142.582677 79.653543 
L 268.724409 79.653543 
" clip-path="url(#pedffc448f9)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_7">
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(158.602418 93.076453)">¿Qué puede comprender una</text>
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(162.230231 101.413178)">audiencia, para una tarea?</text>
   </g>
   <g id="text_8">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(148.818898 122.915045)">Relación por la que una</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(148.818898 131.823338)">audiencia comprende aspectos</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(148.818898 140.73163)">relevantes del funcionamiento o</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(148.818898 149.639923)">de la salida del sistema.</text>
   </g>
   <g id="text_9">
    <text style="fill: #991b1b; font: 700 6.8px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start" x="152.503937" y="189.711487" transform="rotate(-0 152.503937 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_10">
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(152.503937 200.028837)">Un modelo sencillo para una</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(152.503937 207.621674)">persona experta puede ser opaco</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(152.503937 215.214512)">para otra audiencia.</text>
   </g>
   <g id="line2d_3">
    <path d="M 278.07874 79.653543 
L 404.220472 79.653543 
" clip-path="url(#pedffc448f9)" style="fill: none; stroke: #1a1a1a; stroke-width: 0.8; stroke-linecap: square"/>
   </g>
   <g id="text_11">
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(290.40595 93.076453)">¿Qué procedimientos producen</text>
    <text style="fill: #1a1a1a; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(302.163388 101.479559)">comprensión o razones?</text>
   </g>
   <g id="text_12">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(284.314961 122.915045)">Procedimientos y artefactos que</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(284.314961 131.837588)">intentan producir esa</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(284.314961 140.74588)">comprensión o aportar razones</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(284.314961 149.654173)">examinables.</text>
   </g>
   <g id="text_13">
    <text style="fill: #991b1b; font: 700 6.8px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start" x="288" y="189.711487" transform="rotate(-0 288 189.711487)">Lo que no garantiza</text>
   </g>
   <g id="text_14">
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(288 200.028837)">Una explicación post-hoc no</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(288 207.621674)">vuelve transparente el modelo:</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(288 215.214512)">aproxima una parte de su</text>
    <text style="fill: #1a1a1a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(288 222.807349)">comportamiento.</text>
   </g>
   <g id="text_15">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(56.096405 274.66489)">Ninguna de las tres equivale a confiabilidad: esta depende además de validez, seguridad, robustez,</text>
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(153.282592 283.429115)">privacidad, equidad y gobernanza.</text>
   </g>
   <g id="text_16">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="70.15748" y="72.201228" transform="rotate(-0 70.15748 72.201228)">Transparencia</text>
   </g>
   <g id="text_17">
    <text style="fill: #ffffff; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="205.653543" y="72.201228" transform="rotate(-0 205.653543 72.201228)">Interpretabilidad</text>
   </g>
   <g id="text_18">
