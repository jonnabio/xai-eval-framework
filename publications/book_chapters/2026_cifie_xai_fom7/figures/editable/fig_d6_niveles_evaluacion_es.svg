    <text style="fill: #1e40af; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="28.858696" transform="rotate(-0 191.338583 28.858696)">Centrada en la aplicación</text>
   </g>
   <g id="text_2">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="43.778537" transform="rotate(-0 191.338583 43.778537)">Personas expertas en tareas reales.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="59.078499" transform="rotate(-0 191.338583 59.078499)">¿Mejora la explicación el desempeño en el contexto de uso?</text>
   </g>
   <g id="text_4">
    <text style="fill: #0369a1; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="101.050552" transform="rotate(-0 191.338583 101.050552)">Centrada en humanos</text>
   </g>
   <g id="text_5">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="116.062002" transform="rotate(-0 191.338583 116.062002)">Personas en tareas simplificadas.</text>
   </g>
   <g id="text_6">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="131.361963" transform="rotate(-0 191.338583 131.361963)">¿Comprenden, anticipan o corrigen mejor las personas?</text>
   </g>
   <g id="text_7">
    <text style="fill: #047857; font: 700 8.2px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="173.334016" transform="rotate(-0 191.338583 173.334016)">Funcionalmente fundamentada</text>
   </g>
   <g id="text_8">
    <text style="fill: #1a1a1a; font: 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="188.345466" transform="rotate(-0 191.338583 188.345466)">Proxies computacionales, sin participantes.</text>
   </g>
   <g id="text_9">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="191.338583" y="203.645428" transform="rotate(-0 191.338583 203.645428)">¿Qué propiedades medibles tiene el artefacto explicativo?</text>
   </g>
   <g id="text_10">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(23.078499 153.503181) rotate(-90)">más realismo y más coste</text>
   </g>
   <g id="text_11">
    <text style="fill: #1a1a1a; font: italic 7.6px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(390.165113 173.375993) rotate(-90)">más control, escala y reproducibilidad</text>
   </g>
   <g id="text_12">
    <text style="fill: #ffffff; font: 700 7.6px 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle" x="318.047244" y="232.495876" transform="rotate(-0 318.047244 232.495876)">Nivel de FOM-7 y del caso</text>
   </g>
   <g id="text_13">
    <text style="fill: #4a4a4a; font: italic 6.8px 'Times New Roman', 'DejaVu Serif', serif" transform="translate(65.19685 228.091829)">Ningún nivel domina en todos los casos: cada uno responde</text>
